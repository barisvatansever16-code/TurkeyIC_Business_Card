<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ferruh Dede</title>
  <meta name="description" content="Ferruh Dede — Turkey IC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f3f5f7; --ink:#111827; --muted:#8b95a5; --green:#0f6b4c; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: "Manrope", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 420px; margin: 0 auto;
      padding: 2.5rem 1.2rem 3rem; text-align: center;
    }
    .avatar {
      width: 168px; height: 168px; margin: 0 auto 1.1rem;
      border-radius: 50%; object-fit: cover; background: #fff;
      box-shadow: 0 14px 36px rgba(17,24,39,.16);
    }
    h1 { margin: 0; font-size: 1.85rem; font-weight: 700; letter-spacing: -0.02em; }
    .org { margin: .4rem 0 1.5rem; color: var(--muted); font-size: .95rem; font-weight: 500; }
    .stack { display: grid; gap: .7rem; text-align: left; }
    .row {
      background: #fff; border-radius: 14px; padding: .9rem 1rem;
    }
    .row .k { display:block; font-size:.72rem; color:var(--muted); margin-bottom:.2rem; font-weight:500; }
    .row .v {
      color: var(--green); font-size: 1.02rem; font-weight: 600;
      text-decoration: none; word-break: break-word; white-space: pre-line; line-height: 1.35;
    }
    .actions { display:flex; gap:.65rem; margin-top:1.4rem; }
    .btn {
      flex:1; appearance:none; border:0; border-radius:999px;
      padding:1rem 1rem; font:inherit; font-weight:700; font-size:.95rem;
      cursor:pointer; text-decoration:none; text-align:center;
    }
    .btn-primary { background:#0f172a; color:#fff; }
    .btn-soft { background:#fff; color:#0f172a; box-shadow: inset 0 0 0 1px rgba(15,23,42,.1); }
    .hint { margin: 1rem 0 0; color: var(--muted); font-size: .8rem; }
    .brand {
      margin-top: 1.6rem; font-size: .72rem; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="avatar" src="ferruh-photo.jpg" alt="Ferruh Dede" width="168" height="168">
    <h1>Ferruh Dede</h1>
    <p class="org">Turkey IC</p>
    <div class="stack">
      <div class="row">
        <span class="k">Telefon</span>
        <a class="v" href="tel:+905050901665">+90 505 090 16 65</a>
      </div>
      <div class="row">
        <span class="k">E-posta</span>
        <a class="v" href="mailto:turkeyic@turkeyic.com">turkeyic@turkeyic.com</a>
      </div>
      <div class="row">
        <span class="k">Adres</span>
        <span class="v">3. Meltem Sk. 25B
16150 Bursa
Osmangazi Türkiye</span>
      </div>
      <div class="row">
        <span class="k">Web</span>
        <a class="v" href="http://www.turkeyic.com" target="_blank" rel="noopener">http://www.turkeyic.com</a>
      </div>
    </div>
    <div class="actions">
      <a class="btn btn-primary" id="save" href="ferruh-dede.vcf">Rehbere ekle</a>
      <a class="btn btn-soft" href="https://wa.me/905050901665">WhatsApp</a>
    </div>
    <p class="hint">Rehbere ekle → fotoğraflı kişi kartı açılır</p>
    <p class="brand">Turkey IC</p>
  </main>
  <script>
    (function () {
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!mobile) return;
      // Open the vCard so Contacts preview includes PHOTO (text/x-vcard from Pages)
      setTimeout(function () {
        window.location.href = "ferruh-dede.vcf";
      }, 500);
    })();
  </script>
</body>
</html>
