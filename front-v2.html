<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Front v2</title>
  <link rel="stylesheet" href="card-v2.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{box-shadow:none}</style>
</head>
<body>
  <article class="card front">
    <aside class="front-qr">
      <div class="pattern" aria-hidden="true"></div>
      <div class="qr-frame"><img src="assets/qr-ferruh.png" alt="QR"></div>
      <p class="qr-caption">Scan · Save Contact</p>
    </aside>
    <section class="front-info">
      <div class="pattern" aria-hidden="true"></div>
      <div class="identity">
        <h1 class="name"><span class="given">Ferruh</span> <span class="family">Dede</span></h1>
        <p class="role">Senior Immigration Consultant</p>
        <div class="rule" aria-hidden="true"></div>
      </div>
      <ul class="contacts">
        <li>
          <span>+90 505 090 16 65</span>
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
        </li>
        <li>
          <span>turkeyic@turkeyic.com</span>
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          </span>
        </li>
        <li>
          <span>www.turkeyic.com</span>
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          </span>
        </li>
      </ul>
    </section>
  </article>
</body>
</html>
