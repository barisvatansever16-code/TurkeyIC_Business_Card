<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Back Architectural</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card-arch.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{box-shadow:none}</style>
</head>
<body>
  <article class="card back">
    <div class="arch-frame" aria-hidden="true">
      <span class="corner-bl"></span>
      <span class="corner-br"></span>
    </div>
    <div class="back-inner">
      <header class="back-head">
        <img class="mark" src="assets/turkeyic-logo.png" alt="Turkey IC">
        <p class="sheet-mark">TR-IC / 02</p>
      </header>
      <div class="services-block">
        <h2 class="services-title">Immigration Services</h2>
        <ul class="services">
          <li><span>01</span>Citizenship</li>
          <li><span>02</span>Residence Permit</li>
          <li><span>03</span>Work Permit</li>
          <li><span>04</span>Visa</li>
          <li><span>05</span>Investment Consultancy</li>
          <li><span>06</span>Health Insurance</li>
          <li><span>07</span>Translation</li>
          <li><span>08</span>Legal Advice</li>
        </ul>
      </div>
      <footer class="back-foot">
        <span>www.turkeyic.com</span>
        <span>Bursa Türkiye</span>
      </footer>
    </div>
  </article>
</body>
</html>
