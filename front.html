<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Front</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{border-radius:0;box-shadow:none}</style>
</head>
<body>
  <article class="card front">
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 850 550" preserveAspectRatio="none">
        <defs>
          <pattern id="geo" width="28" height="28" patternUnits="userSpaceOnUse">
            <path d="M14 1 L27 14 L14 27 L1 14 Z" fill="none" stroke="rgba(212,175,55,0.07)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="850" height="550" fill="url(#geo)"/>
        <rect x="18" y="18" width="814" height="514" fill="none" stroke="#d4af37" stroke-width="2.2"/>
        <rect x="28" y="28" width="794" height="494" fill="none" stroke="rgba(212,175,55,0.45)" stroke-width="1"/>
        <g fill="#d4af37">
          <path d="M42 42 L54 30 L66 42 L54 54 Z"/>
          <path d="M784 42 L796 30 L808 42 L796 54 Z"/>
          <path d="M42 508 L54 496 L66 508 L54 520 Z"/>
          <path d="M784 508 L796 496 L808 508 L796 520 Z"/>
        </g>
        <g fill="none" stroke="#d4af37" stroke-width="1.4">
          <path d="M42 275 l8 -8 8 0 8 8 0 8 -8 8 -8 0 -8 -8 z"/>
          <path d="M776 275 l8 -8 8 0 8 8 0 8 -8 8 -8 0 -8 -8 z"/>
        </g>
      </svg>
    </div>
    <div class="front-inner">
      <header class="brand"><img src="assets/turkeyic-logo.png" alt="Turkey IC"></header>
      <div class="front-grid">
        <div class="identity">
          <p class="eyebrow">Turkey Immigration Consultant</p>
          <h1>Ferruh <span>DEDE</span></h1>
          <p class="role">Senior Immigration Consultant</p>
          <div class="gold-rule" aria-hidden="true"></div>
          <ul class="contacts">
            <li><span class="label">Phone</span><span class="value">+90 505 090 16 65</span></li>
            <li><span class="label">Email</span><span class="value">turkeyic@turkeyic.com</span></li>
            <li><span class="label">Web</span><span class="value">www.turkeyic.com</span></li>
            <li><span class="label">Office</span><span class="value">Osmangazi, Bursa</span></li>
          </ul>
        </div>
        <aside class="qr-block">
          <div class="qr-medal">
            <div class="qr-frame"><img src="assets/qr-ferruh.png" alt="Scan to open contact"></div>
          </div>
          <p class="qr-caption">Scan · Save Contact</p>
        </aside>
      </div>
    </div>
  </article>
</body>
</html>
