<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Front</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{border-radius:0;box-shadow:none}</style>
</head>
<body>
  <article class="card front">
    <div class="hairline top" aria-hidden="true"></div>
    <header class="brand"><img src="assets/turkeyic-logo.png" alt="Turkey IC"></header>
    <div class="front-body">
      <div class="identity">
        <h1>Ferruh <span>DEDE</span></h1>
        <p class="role">Senior Immigration Consultant</p>
        <ul class="contacts">
          <li><span class="label">Phone</span><span class="value">+90 505 090 16 65</span></li>
          <li><span class="label">Email</span><span class="value">turkeyic@turkeyic.com</span></li>
          <li><span class="label">Web</span><span class="value">www.turkeyic.com</span></li>
        </ul>
      </div>
      <aside class="qr-block">
        <div class="qr-frame"><img src="assets/qr-ferruh.png" alt="Scan to save contact"></div>
        <p class="qr-caption">Scan to save</p>
      </aside>
    </div>
    <div class="hairline bottom" aria-hidden="true"></div>
  </article>
</body>
</html>
