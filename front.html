<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Front</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{border-radius:0;box-shadow:none}</style>
</head>
<body>
  <article class="card front">
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 850 550" preserveAspectRatio="none">
        <rect x="18" y="18" width="814" height="514" fill="none" stroke="#b8943a" stroke-width="2"/>
        <rect x="28" y="28" width="794" height="494" fill="none" stroke="rgba(184,148,58,0.35)" stroke-width="1"/>
      </svg>
    </div>
    <div class="front-inner">
      <header class="brand"><img src="assets/turkeyic-logo.png" alt="Turkey IC"></header>
      <div class="front-grid">
        <div class="identity">
          <h1>Ferruh&nbsp;DEDE</h1>
          <p class="role">Senior Immigration Consultant</p>
          <div class="gold-rule" aria-hidden="true"></div>
          <ul class="contacts">
            <li><span class="label">Phone</span><span class="value">+90 505 090 16 65</span></li>
            <li><span class="label">Email</span><span class="value">turkeyic@turkeyic.com</span></li>
            <li><span class="label">Web</span><span class="value">www.turkeyic.com</span></li>
          </ul>
        </div>
        <aside class="qr-block">
          <div class="qr-frame"><img src="assets/qr-ferruh.png" alt="Scan to open contact"></div>
          <p class="qr-caption">Scan · Save Contact</p>
        </aside>
      </div>
    </div>
  </article>
</body>
</html>
