<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{border-radius:0;box-shadow:none}</style>
</head>
<body>
  <article class="card back">
    <div class="hairline top" aria-hidden="true"></div>
    <header class="back-head"><img class="mark" src="assets/turkeyic-logo.png" alt="Turkey IC"></header>
    <ul class="services">
      <li>Citizenship</li>
      <li>Residence Permit</li>
      <li>Work Permit</li>
      <li>Visa</li>
      <li>Investment Consultancy</li>
      <li>Health Insurance</li>
      <li>Translation</li>
      <li>Legal Advice</li>
    </ul>
    <footer class="back-foot">
      <span>www.turkeyic.com</span>
      <span>Bursa Türkiye</span>
    </footer>
    <div class="hairline bottom" aria-hidden="true"></div>
  </article>
</body>
</html>
