<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{border-radius:0;box-shadow:none}</style>
</head>
<body>
  <article class="card back">
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 850 550" preserveAspectRatio="none">
        <rect x="18" y="18" width="814" height="514" fill="none" stroke="#b8943a" stroke-width="2"/>
        <rect x="28" y="28" width="794" height="494" fill="none" stroke="rgba(184,148,58,0.35)" stroke-width="1"/>
      </svg>
    </div>
    <div class="back-inner">
      <header class="back-head">
        <img class="mark" src="assets/turkeyic-logo.png" alt="Turkey IC">
      </header>
      <div class="services-block">
        <h2 class="services-title">Immigration Services</h2>
        <ul class="services">
          <li><span>01</span>Citizenship</li>
          <li><span>02</span>Residence Permit</li>
          <li><span>03</span>Work Permit</li>
          <li><span>04</span>Visa</li>
          <li><span>05</span>Investment Consultancy</li>
          <li><span>06</span>Health Insurance</li>
          <li><span>07</span>Translation</li>
          <li><span>08</span>Legal Advice</li>
        </ul>
      </div>
      <footer class="back-foot">
        <span>www.turkeyic.com</span>
        <span class="sep" aria-hidden="true">◆</span>
        <span>Bursa Türkiye</span>
      </footer>
    </div>
  </article>
</body>
</html>
