<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Back v2</title>
  <link rel="stylesheet" href="card-v2.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{box-shadow:none}</style>
</head>
<body>
  <article class="card back">
    <div class="pattern" aria-hidden="true"></div>

      <span>Residence Permit</span><i class="dot"></i>
      <span>Translation</span>
    </div>
    <div class="back-hero">
      <img src="assets/turkeyic-logo.png" alt="Turkey IC">
    </div>
    <div class="svc-row bottom">
      <span>Investment Consultancy</span><i class="dot"></i>
      <span>Health Insurance</span><i class="dot"></i>
      <span>Legal Advice</span><i class="dot"></i>
      <span>Visa</span>
    </div>
  </article>
</body>
</html>
