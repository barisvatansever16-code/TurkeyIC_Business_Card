<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey IC — Back v3</title>
  <link rel="stylesheet" href="card-v3.css">
  <style>html,body{margin:0;background:#fff;width:85mm;height:55mm;overflow:hidden}.card{box-shadow:none}</style>
</head>
<body>
  <article class="card back">
    <div class="pattern" aria-hidden="true"></div>
    <header class="back-head">
      <img class="mark" src="assets/turkeyic-logo.png" alt="Turkey IC">
    </header>
    <div class="services-block">
      <ul class="services">
        <li><span>01</span>Citizenship</li>
        <li><span>02</span>Residence Permit</li>
        <li><span>03</span>Work Permit</li>
        <li><span>04</span>Visa</li>
        <li><span>05</span>Investment Consultancy</li>
        <li><span>06</span>Health Insurance</li>
        <li><span>07</span>Translation</li>
        <li><span>08</span>Legal Advice</li>
      </ul>
    </div>
    <footer class="back-foot">
      <span>www.turkeyic.com</span>
      <span>Bursa Türkiye</span>
    </footer>
  </article>
</body>
</html>
